<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 3 Easy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <nav class="navbar">
        <div class="logo">
          <img src="./images/logo.png" alt="logo" height="50" />
        </div>
        <div class="nav-btn">
          <ul>
            <li>About</li>
            <li>Watch now</li>
            <li>Actors</li>
            <li>Contact</li>
          </ul>
        </div>
        <div class="menu-btn">
          <img src="./images/menu (1).png" height="40" alt="menu-dropdown" />
        </div>
      </nav>
      <main>
        <div class="left-part">
          <div class="logo">
            <img src="./images/logo.png" alt="" height="170" />
          </div>
          <div class="main-text">
            <div class="main-desc">
              Action / Thriller / Drama Series directed by Dong-hyuk Hwang
            </div>
            <div class="episode">Season 1: 9 Episodes</div>
          </div>
          <div class="main-two-btn">
            <button class="btn-one">
              <img src="./images/play-button (1).png" alt="play" height="22" />
              <p>Play Now</p>
            </button>
            <button class="btn-two">
              <img src="./images/play-button (1).png" alt="" height="22" />
              Watch Trailer
            </button>
          </div>
        </div>
        <div class="right-part">
          <img src="./images/guard.png" alt="guard" height="500" />
        </div>
      </main>
      <footer>
        <div class="watch-clips">
          <img src="./images/one.jpg" alt="img" height="180" />
          <img
            src="./images/play-button (1).png"
            alt="play"
            height="30"
            class="play-btn"
          />
        </div>
        <div class="watch-clips">
          <img src="./images/two.jpg" alt="img" height="180" />
          <img
            src="./images/play-button (1).png"
            alt="play"
            height="30"
            class="play-btn"
          />
        </div>
        <div class="watch-clips">
          <img src="./images/three.jpg" alt="img" height="180" />
          <img
            src="./images/play-button (1).png"
            alt="play"
            height="30"
            class="play-btn"
          />
        </div>
      </footer>
    </div>
  </body>
</html>
