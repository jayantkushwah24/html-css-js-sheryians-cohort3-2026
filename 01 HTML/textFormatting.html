<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Formatting Tags</title>
  </head>
  <body>
    <p>
      <b>bold</b>
      <strong>strong</strong>
      <i>italic</i>
      <em>emphasized</em>
      <mark>marked</mark>
      <small>small</small>
      <del>deleted</del>
      <ins>inserted</ins>
      <u>underlined</u>
      H<sub>2</sub>0 
      X<sup>2</sup>
    </p>
  </body>
</html>
