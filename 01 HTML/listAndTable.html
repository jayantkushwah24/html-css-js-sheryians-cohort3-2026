<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List and Table Tag</title>
  </head>
  <body>
    <table border="2px">
      <caption>
        Grocery List
      </caption>
      <colgroup>
        <col style="background-color: lightblue" />
        <col style="background-color: lightcoral" />
        <col style="background-color: lightgoldenrodyellow" />
      </colgroup>
      <thead>
        <tr>
          <th>Name</th>
          <th>Quantity</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Egg</td>
          <td>5</td>
          <td>10</td>
        </tr>
        <tr>
          <td>Milk</td>
          <td>1</td>
          <td>60</td>
        </tr>
        <tr>
          <td>Bread</td>
          <td>2</td>
          <td>15</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th colspan="2">Total</th>
          <th>140</th>
        </tr>
      </tfoot>
    </table>
    <hr />
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>
    <hr />
    <ol>
      <li>First</li>
      <li>Second</li>
      <li>Third</li>
    </ol>
    <hr />
  </body>
</html>
